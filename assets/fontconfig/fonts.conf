<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Vercel's Node serverless runtime has no fonts and no fontconfig setup at
  all — librsvg (used by sharp for every SVG-with-text layer we render:
  the genre/trend tag row, and the no-logo text fallback) resolves fonts
  through Pango+fontconfig under the hood, so with nothing registered it
  silently falls back to a "no glyphs available" placeholder font and every
  letter renders as a tofu box. This was invisible in local dev (both the
  cloud sandbox and Charles's machine have real system fonts) and only
  surfaced once the genre/trend tag row shipped and was checked live.

  Fix: bundle DejaVu Sans (metrically close to Arial/Helvetica, permissively
  licensed — see assets/fonts/LICENSE) and alias Arial/Helvetica/sans-serif
  to it, so every existing `font-family="Arial, Helvetica, sans-serif"` in
  the codebase picks it up with no SVG changes needed. See lib/fonts.js for
  how FONTCONFIG_PATH gets pointed at this file at runtime.
-->
<fontconfig>
  <dir>__FONT_DIR__</dir>
  <!-- Lambda's filesystem is read-only outside /tmp; fontconfig needs
       somewhere writable for its cache. -->
  <cachedir>/tmp/fontconfig-cache</cachedir>

  <match target="pattern">
    <test qual="any" name="family"><string>Arial</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Helvetica</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
</fontconfig>
