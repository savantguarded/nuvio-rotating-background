name: Keep endpoint warm

# Vercel Hobby's built-in Cron is capped at once per day (any more frequent
# schedule fails at deploy time), which is no use for keeping a Lambda
# instance warm. This runs from GitHub Actions instead — a plain HTTP GET
# against the deployed endpoint needs no code on the Vercel side and no
# plan change. Every real Nuvio app-open then more often hits an
# already-warm instance with the pool/logo caches (lib/tmdb.js) already
# populated, instead of paying a cold start + a full 6-call TMDB pool
# refetch on top of it.
#
# Cost: ~288 requests/day (every 5 min) against Vercel Hobby's 100K/month
# function-invocation allowance — under 1% of it. GitHub Actions minutes are
# free for scheduled workflows on public repos; if this repo ever goes
# private, check the account's included minutes before widening the
# schedule.
#
# Caveat: GitHub disables a scheduled workflow automatically after 60 days
# with no repo activity (commits, etc.) — a low-traffic personal repo like
# this one can hit that. If pings silently stop, re-enable it from the
# Actions tab (Actions -> Keep endpoint warm -> "..." -> Enable workflow);
# any push resets the 60-day clock.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/background
        run: |
          set -e
          url="https://nuvio-rotating-background.vercel.app/api/background"
          code=$(curl -sS -o /tmp/resp.jpg -w '%{http_code}' "$url" || echo "curl_failed")
          echo "status: $code"
          if [ "$code" != "200" ]; then
            echo "::warning::warm-ping got HTTP $code from $url (fallback gradient may have been served instead of erroring — see api/background.js's try/catch)"
          fi
