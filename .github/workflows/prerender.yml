name: Pre-render backgrounds

# Renders a fresh set of ~30 backgrounds every hour and publishes them to
# GitHub Pages. api/background.js serves a random one from that set, so an
# app open no longer waits on TMDB + Sharp (see the comment at the top of
# api/background.js). Renders run here on GitHub's runners rather than on
# Vercel Hobby's single vCPU.
#
# One-time setup (repo Settings):
#   - Secrets and variables -> Actions -> secret TMDB_API_KEY
#   - Pages -> Build and deployment -> Source: GitHub Actions
#
# Cost: free for a public repo (~1-2 runner minutes per run).
#
# Caveat, same as keep-warm.yml: GitHub disables scheduled workflows after
# 60 days without repo activity. If that happens the last published set
# keeps being served (just no longer refreshed) until it's re-enabled from
# the Actions tab.

on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'scripts/**'
      - 'assets/**'
      - 'package*.json'
      - '.github/workflows/prerender.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Render
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/prerender.js site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: render
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
